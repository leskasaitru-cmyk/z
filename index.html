<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aleksej</title> 
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030303;
            --text-main: #ffffff;
            --text-muted: #888888;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
        }

        /* --- ФОН (БЕЗ АНИМАЦИЙ) --- */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 20% 20%, rgba(100, 100, 255, 0.2) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 100, 200, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 50% 50%, rgba(100, 200, 255, 0.1) 0%, transparent 60%),
                        #030303;
        }

        .bg-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            max-width: 420px;
            width: 100%;
            z-index: 1;
            flex-grow: 1;
            justify-content: center;
        }

        /* Аватар */
        .avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .avatar-wrapper:active {
            transform: scale(0.97);
        }

        .avatar-ring-outer {
            position: absolute;
            top: -12px;
            left: -12px;
            width: calc(100% + 24px);
            height: calc(100% + 24px);
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, rgba(130, 130, 255, 0.8), transparent, rgba(255, 100, 200, 0.8), transparent);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
            opacity: 0.7;
        }

        .avatar-ring-inner {
            position: absolute;
            top: -6px;
            left: -6px;
            width: calc(100% + 12px);
            height: calc(100% + 12px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(130, 130, 255, 0.3);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #1a1a1a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 30px rgba(0,0,0,0.8);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Имя */
        .name {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-top: 5px;
            background: linear-gradient(135deg, #ffffff 30%, #a0a0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 15px rgba(160, 160, 255, 0.3));
        }

        /* Статус */
        .status-text {
            font-size: 14px;
            font-weight: 600;
            color: #a0a0ff;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2px;
            text-shadow: 0 0 10px rgba(160, 160, 255, 0.3);
        }

        /* Локация */
        .location {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            color: #bbbbbb;
            margin-top: 10px;
            background: var(--card-bg);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .location svg {
            width: 14px;
            height: 14px;
            fill: #bbbbbb;
            transition: fill 0.3s ease;
        }

        .location:hover {
            color: #ffffff;
            border-color: rgba(160, 160, 255, 0.4);
            background: rgba(160, 160, 255, 0.1);
            box-shadow: 0 0 15px rgba(160, 160, 255, 0.1);
        }

        .location:hover svg {
            fill: #a0a0ff;
        }

        /* Соцсети */
        .socials {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .social-link {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 56px;
            height: 56px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #d0d0d0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(15px);
            text-decoration: none;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .social-link::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }

        .social-link:hover::before {
            left: 100%;
        }

        .social-link:hover {
            transform: translateY(-5px) scale(1.1);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .social-link[aria-label="Discord"]:hover { color: #5865F2; border-color: #5865F2; box-shadow: 0 0 20px rgba(88, 101, 242, 0.4); }
        .social-link[aria-label="Telegram"]:hover { color: #229ED9; border-color: #229ED9; box-shadow: 0 0 20px rgba(34, 158, 217, 0.4); }
        .social-link[aria-label="TikTok"]:hover { color: #ff0050; border-color: #ff0050; box-shadow: 0 0 20px rgba(255, 0, 80, 0.4); }
        .social-link[aria-label="VK"]:hover { color: #0077FF; border-color: #0077FF; box-shadow: 0 0 20px rgba(0, 119, 255, 0.4); }
        .social-link[aria-label="GitHub"]:hover { color: #ffffff; border-color: #ffffff; box-shadow: 0 0 20px rgba(255, 255, 255, 0.4); }

        .social-link svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
            transition: all 0.3s ease;
            z-index: 2;
        }

        /* Счётчик */
        .views-counter {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #666666;
            margin-top: 30px;
            letter-spacing: 0.5px;
            background: var(--card-bg);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
        }

        .views-counter svg {
            width: 14px;
            height: 14px;
            fill: #666666;
        }

        /* Подвал */
        .footer {
            margin-top: 40px;
            padding-bottom: 10px;
            font-size: 12px;
            font-weight: 500;
            color: #333333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            z-index: 1;
            letter-spacing: 0.5px;
            transition: all 0.5s ease;
            cursor: default;
        }

        .footer svg {
            width: 14px;
            height: 14px;
            fill: #333333;
            transition: all 0.5s ease;
        }

        .footer:hover {
            color: #a0a0ff;
            text-shadow: 0 0 10px rgba(160, 160, 255, 0.4);
        }

        .footer:hover svg {
            fill: #a0a0ff;
        }

        /* --- МОДАЛЬНОЕ ОКНО ДЛЯ ФОТО --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 16px;
            object-fit: contain;
            box-shadow: 0 0 50px rgba(160, 160, 255, 0.3);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal.active img {
            transform: scale(1);
        }

        /* Крестик */
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            font-size: 28px;
            line-height: 1;
            z-index: 10000;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
            box-shadow: 0 0 20px rgba(160, 160, 255, 0.5);
        }

        /* --- ОСОБЕННОСТИ ДЛЯ ТЕЛЕФОНА --- */
        @media (max-width: 768px) {
            .bg-animation {
                background: radial-gradient(circle at 20% 20%, rgba(80, 80, 220, 0.25) 0%, transparent 50%),
                            radial-gradient(circle at 80% 80%, rgba(220, 80, 180, 0.2) 0%, transparent 50%),
                            radial-gradient(circle at 50% 50%, rgba(80, 180, 220, 0.15) 0%, transparent 60%),
                            #030303;
            }
        }

        @media (max-width: 480px) {
            .name { font-size: 32px; }
            .avatar-wrapper { width: 110px; height: 110px; }
            .socials { gap: 10px; }
            .social-link { width: 50px; height: 50px; border-radius: 16px; }
            .social-link svg { width: 24px; height: 24px; }
            .location { font-size: 12px; }
            .status-text { font-size: 12px; }
            .footer { margin-top: 30px; font-size: 11px; }
            .modal-close { width: 44px; height: 44px; font-size: 24px; top: 15px; right: 15px; }
            .modal img { max-width: 95vw; max-height: 85vh; }
        }
    </style>
</head>

    <script>
        // Открытие модального окна
        function openModal() {
            const modal = document.getElementById('photoModal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden'; // Блокируем скролл
        }

        // Закрытие модального окна
        function closeModal(event) {
            if (event) event.stopPropagation();
            const modal = document.getElementById('photoModal');
            modal.classList.remove('active');
            document.body.style.overflow = ''; // Возвращаем скролл
        }

        // Закрытие по клавише Esc
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Счётчик просмотров
        document.addEventListener("DOMContentLoaded", function() {
            const hasVisited = localStorage.getItem('albanoVisited');
            let currentViews = 60;

            if (!hasVisited) {
                currentViews = 61;
                localStorage.setItem('albanoVisited', 'true');
                localStorage.setItem('albanoViews', currentViews);
            } else {
                const savedViews = localStorage.getItem('albanoViews');
                if (savedViews) {
                    currentViews = parseInt(savedViews);
                } else {
                    currentViews = 61;
                    localStorage.setItem('albanoViews', currentViews);
                }
            }
            document.getElementById('viewCount').textContent = currentViews;
        });
    </script>

</body>
</html>
